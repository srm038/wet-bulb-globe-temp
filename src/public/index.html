<html>
  <head>
    <title>Wet Bulb Temperature</title>
    <script
      src="https://unpkg.com/htmx.org@2.0.1"
      integrity="sha384-QWGpdj554B4ETpJJC9z+ZHJcA/i59TyjxEPXiiUgN2WmTyV5OEZWCD6gQhgkdpB/"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/htmx-ext-head-support@2.0.0/head-support.js"></script>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}' />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body hx-ext="head-support">
    <div id="container">
      <div id="location">
        <input id="latitude" name="latitude" readonly />
        <input id="longitude" name="longitude" readonly />
      </div>
      <div
        id="metrics"
        hx-get="/data"
        hx-trigger="load, location-updated from:body, every 15m"
        hx-include="#latitude, #longitude"
      >
        <div id="gauge-wbgt" class="gauge gauge--wbgt" style="--pct: 0; --angle: 90deg">
          <div class="gauge-track">
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">WBGT</div>
        </div>
        <div id="gauge-temp" class="gauge gauge--temp">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Temperature</div>
        </div>
        <div id="gauge-rh" class="gauge gauge--rh">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Humidity</div>
        </div>
        <div id="gauge-cloud" class="gauge gauge--cloud">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Cloud Cover</div>
        </div>
        <div id="gauge-wind" class="gauge gauge--wind">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Wind Speed</div>
        </div>
        <div id="gauge-radiation" class="gauge gauge--radiation">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Direct Radiation</div>
        </div>
        <div id="gauge-dewpoint" class="gauge gauge--dewpoint">
          <div class="gauge-track">
            <div class="gauge-fill"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="gauge-value">&nbsp;</div>
          <div class="gauge-label">Dewpoint</div>
        </div>
      </div>
    </div>

    <script>
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          document.getElementById("latitude").value = position.coords.latitude;
          document.getElementById("longitude").value =
            position.coords.longitude;

          // Dispatch a custom event to trigger the HTMX request
          document.body.dispatchEvent(new Event("location-updated"));
        });
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    </script>
  </body>
</html>
